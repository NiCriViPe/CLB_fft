[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clb-fft"
dynamic = ["version"]
description = "Motor current signature analysis (MCSA) of HIOKI PQ ONE waveform exports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
clb-fft = "clb_fft.cli:main"

[tool.setuptools.dynamic]
version = { attr = "clb_fft.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["Predictive_maintenance_module", "Integra_FFT.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
